name: build image
on:
  workflow_dispatch:
    inputs:
      lean_toolchain:
        description: elan toolchain name
        default: "leanprover/lean4:v4.33.1"
        required: true
      mathlib_rev:
        description: Mathlib commit (the Prove2me environment's mathlib_rev)
        default: "0df444a360eaa60ab8c11dca51a86af692955474"
        required: true
  push:
    branches: [main]
    paths: [Dockerfile, check.sh, .github/workflows/build.yml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the Mathlib cache needs about 15 GB while building)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: t
        run: |
          TC="${{ inputs.lean_toolchain || 'leanprover/lean4:v4.33.1' }}"
          REV="${{ inputs.mathlib_rev || '0df444a360eaa60ab8c11dca51a86af692955474' }}"
          echo "tc=$TC" >> "$GITHUB_OUTPUT"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "tag=${TC##*:}-${REV:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            LEAN_TOOLCHAIN=${{ steps.t.outputs.tc }}
            MATHLIB_REV=${{ steps.t.outputs.rev }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nrp-lean-env:${{ steps.t.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/nrp-lean-env:latest
